name: Common

inputs:
    ssh-key:
        required: true
    ssh-ip:
        required: true

runs:
    using: composite
    steps:
        - name: TruffleHog OSS
          uses: trufflesecurity/trufflehog@v3.99.7

        - name: webfactory/ssh-agent
          uses: webfactory/ssh-agent@v0.10.0
          with:
              ssh-private-key: ${{ inputs.ssh-key }}

        - name: Trust Host
          run: ssh-keyscan -H ${{ inputs.ssh-ip }} >> ~/.ssh/known_hosts
