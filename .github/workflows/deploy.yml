name: Deploy

on:
    push:
        branches: [main]

env:
    SSH_SERVER: ${{ secrets.SSH_USER }}@${{ secrets.SSH_IP }}
    WORK_DIR: /home/ubuntu/devops_05/go_gin_be
    COMPOSE_FILE_DIR: /home/ubuntu/devops_05

jobs:
    job_check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source
              uses: actions/checkout@v7.0.1

            - name: TruffleHog OSS
              uses: trufflesecurity/trufflehog@v3.99.7

            - name: Check Dockerfile file
              run: test -f Dockerfile

            - name: webfactory/ssh-agent
              uses: webfactory/ssh-agent@v0.10.0
              with:
                  ssh-private-key: ${{ secrets.SSH_KEY }}

            - name: Trust Host
              run: ssh-keyscan -H ${{ secrets.SSH_IP }}  >> ~/.ssh/known_hosts

            - name: Check env file
              run: |
                  ssh $SSH_SERVER "
                    set -e

                    cd $WORK_DIR
                    ls -la
                    test -f .env
                  "

            - name: Check docker compose file
              run: |
                  ssh $SSH_SERVER "
                    set -e

                    cd $COMPOSE_FILE_DIR
                    ls -la
                    test -f docker-compose.yml
                  "

    job_build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source
              uses: actions/checkout@v7.0.1

            - name: Build Image Docker
              run: docker build -t go_gin_be_img .

            - name: Move Image To Server
              run: docker save go_gin_be_img | gzip | ssh $SSH_SERVER "gunzip | docker load" 

