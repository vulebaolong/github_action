name: Practice WorkFlow

on:
#   push: 
  workflow_dispatch: 


jobs:
    job_check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source
              id: check-source
              uses: actions/checkout@v7.0.1

            - name: Check Readme file
              id: check
              run: |
                ls -la
                test -f README.md
                echo "status=success" >> $GITHUB_OUTPUT

            - name: show
              run: echo ${{ steps.check.outputs.status }}

